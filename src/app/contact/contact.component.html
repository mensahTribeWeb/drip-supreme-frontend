<section class="text-gray-400 bg-gray-900 body-font relative">
  <div class="container px-5 py-24 mx-auto flex sm:flex-nowrap flex-wrap">
    <div
      class="lg:w-2/3 md:w-1/2 bg-gray-900 rounded-lg overflow-hidden sm:mr-10 p-10 flex items-end justify-start relative"
    >
      <iframe
        title="Downtown Chicago Map"
        width="100%"
        height="100%"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        scrolling="no"
        class="absolute inset-0 custom-iframe"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2968.7022285302817!2d-87.6242421!3d41.8912335!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x880e2c2f6428b945%3A0x8c13bbd6fbb0ec0e!2sDowntown%20Chicago%2C%20IL!5e0!3m2!1sen!2sus!4v1670076801231!5m2!1sen!2sus"
        allowfullscreen=""
      ></iframe>

      <div class="bg-gray-900 relative flex flex-wrap py-6 rounded shadow-md">
        <div class="lg:w-1/2 px-6">
          <h2
            class="title-font font-semibold text-white tracking-widest text-xs"
          >
            ADDRESS
          </h2>
          <p class="mt-1">New Address Goes Here</p>
        </div>
        <div class="lg:w-1/2 px-6 mt-4 lg:mt-0">
          <h2
            class="title-font font-semibold text-white tracking-widest text-xs"
          >
            EMAIL
          </h2>
          <a class="text-blue-400 leading-relaxed">example&#64;email.com</a>
          <h2
            class="title-font font-semibold text-white tracking-widest text-xs mt-4"
          >
            PHONE
          </h2>
          <p class="leading-relaxed">New Phone Number</p>
        </div>
      </div>
    </div>
    <div
      class="lg:w-1/3 md:w-1/2 flex flex-col md:ml-auto w-full md:py-8 mt-8 md:mt-0"
    >
      <h2 class="text-white text-lg mb-1 font-medium title-font">
        Let's Connect
      </h2>
      <p class="leading-relaxed mb-5">
        Get in touch with us for fast and reliable service.
      </p>
      <form>
        <div class="relative mb-4">
          <label for="name" class="leading-7 text-sm text-gray-400">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your Name"
            class="w-full bg-gray-800 rounded border border-gray-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-900 text-base outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"
          />
        </div>
        <div class="relative mb-4">
          <label for="email" class="leading-7 text-sm text-gray-400"
            >Email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Your Email"
            class="w-full bg-gray-800 rounded border border-gray-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-900 text-base outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"
          />
        </div>
        <!-- Added Address Field -->
        <div class="relative mb-4">
          <label for="address" class="leading-7 text-sm text-gray-400"
            >Address</label
          >
          <input
            type="text"
            id="address"
            name="address"
            placeholder="Your Address"
            class="w-full bg-gray-800 rounded border border-gray-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-900 text-base outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"
          />
        </div>
        <!-- Added Phone Number Field -->
        <div class="relative mb-4">
          <label for="phone" class="leading-7 text-sm text-gray-400"
            >Phone Number</label
          >
          <input
            type="text"
            id="phone"
            name="phone"
            placeholder="Your Phone Number"
            class="w-full bg-gray-800 rounded border border-gray-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-900 text-base outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"
          />
        </div>
        <div class="relative mb-4">
          <label for="message" class="leading-7 text-sm text-gray-400"
            >Message</label
          >
          <textarea
            id="message"
            name="message"
            placeholder="Your Message"
            class="w-full bg-gray-800 rounded border border-gray-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-900 h-32 text-base outline-none text-gray-100 py-1 px-3 resize-none leading-6 transition-colors duration-200 ease-in-out"
          ></textarea>
        </div>
        <button
          type="submit"
          class="text-white bg-blue-500 border-0 py-2 px-6 focus:outline-none hover:bg-blue-600 rounded text-lg"
        >
          Send
        </button>
        <p class="text-xs text-gray-400 text-opacity-90 mt-3">
          Chicharrones blog helvetica normcore iceland tousled brook viral
          artisan.
        </p>
      </form>
    </div>
  </div>
</section>
