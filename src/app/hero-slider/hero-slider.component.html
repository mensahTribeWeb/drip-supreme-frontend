<swiper [config]="swiperConfig" class="h-screen">
  <ng-template swiperSlide>
    <div
      class="h-screen bg-cover bg-center"
      style="background-image: url('assets/images/slide1.jpg')"
    >
      <div
        class="flex items-center justify-center h-full bg-black bg-opacity-60"
      >
        <h2 class="text-4xl md:text-6xl font-extrabold text-white">
          Slide 1 Title
        </h2>
      </div>
    </div>
  </ng-template>
  <ng-template swiperSlide>
    <div
      class="h-screen bg-cover bg-center"
      style="background-image: url('assets/images/slide2.jpg')"
    >
      <div
        class="flex items-center justify-center h-full bg-black bg-opacity-60"
      >
        <h2 class="text-4xl md:text-6xl font-extrabold text-white">
          Slide 2 Title
        </h2>
      </div>
    </div>
  </ng-template>
  <!-- Add additional slides as needed -->
</swiper>
